name: Refresh daily brief and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-brief-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install feed parser
        run: npm ci --ignore-scripts
      - name: Verify data safety and fallback behavior
        run: npm test
      - name: Fetch public data
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public daily brief data [skip ci]'
            git push
          fi
      - name: Build the static page
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
